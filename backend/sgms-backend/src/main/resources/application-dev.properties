spring.application.name=sgms-backend
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/sgdb}
spring.datasource.username=${DATASOURCE_USER:root}
spring.datasource.password=${DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:sgms-backend-super-secure-jwt-secret-key-2026-project-security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ml.api.url=${ML_API_URL:http://127.0.0.1:8000/predict}
ml.confidence.threshold=${ML_CONFIDENCE_THRESHOLD:0.60}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Performance/debug settings for local dev
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
